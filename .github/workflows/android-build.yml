
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build FM27 Coach APK
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil source code dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Menyiapkan Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Menyiapkan Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      # 4. Menyiapkan Gradle 8.9
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 5. Build APK Debug
      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      # 6. Mengunggah APK sebagai artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FM27Coach-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 7. Menjalankan unit test parser
      # Kegagalan test tidak menggagalkan proses build
      - name: Unit Test Parser
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --stacktrace
